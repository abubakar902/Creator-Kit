<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#100b20"><title>Sign in · TrivexaAI</title><link rel="icon" href="../trivexaai-icon.png"><script type="module" src="./auth-client.js"></script><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#39245e,transparent 34rem),#100b20;color:#f8f6fc;font-family:system-ui,Arial;padding:22px}.card{width:min(440px,100%);padding:34px;border:1px solid #392951;border-radius:24px;background:#1a1230;text-align:center;box-shadow:0 25px 70px #0008}.brand{font-size:24px;font-weight:850;margin-bottom:26px}.brand span{color:#e879f9}h1{margin:0 0 8px;font-size:29px}p{color:#b8accd;line-height:1.6}button{width:100%;padding:15px;border:0;border-radius:12px;background:white;color:#211830;font-size:15px;font-weight:800;cursor:pointer}button:disabled{opacity:.6}#status{min-height:42px;margin-top:14px;font-size:13px;color:#d8c9f0}a{color:#d8c9f0;text-decoration:none;font-size:13px}</style></head><body><main class="card"><div class="brand">Trivexa<span>AI</span></div><h1>Welcome to TrivexaAI</h1><p>Continue with Google to use TrivexaAI tools and manage your account.</p><button id="go">Continue with Google</button><div id="status" role="status">Your Google password is never shared with TrivexaAI.</div><a href="../">← Back to website</a></main><script type="module">import{auth,authReady,authConfigured,signInWithGoogle,getAccountProfile,getSafeNextUrl}from"./auth-client.js";const b=document.getElementById("go"),s=document.getElementById("status"),next=getSafeNextUrl();if(!authConfigured){b.disabled=true;s.textContent="Firebase setup is not complete yet. Please try again after the website administrator enables Google sign-in.";}else{authReady.then(async()=>{if(auth?.currentUser){try{awa
