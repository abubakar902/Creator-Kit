<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin · TrivexaAI</title><script type="module" src="./auth-client.js"></script><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#100b20;color:#f8f6fc;font-family:system-ui,Arial}.wrap{max-width:1100px;width:94%;margin:30px auto}.panel{background:#1a1230;border:1px solid #392951;border-radius:17px;padding:20px;margin:16px 0}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand{font-size:22px;font-weight:850;color:white;text-decoration:none}.brand span{color:#e879f9}button,a.btn,input{font:inherit}button,a.btn{background:#2a2042;border:1px solid #493466;color:white;border-radius:9px;padding:9px 12px;cursor:pointer;text-decoration:none}button.primary{background:linear-gradient(100deg,#a78bfa,#e879f9);color:#1b102d;border:0}button.danger{background:#50213c}input{padding:10px;background:#100b20;color:white;border:1px solid #493466;border-radius:9px;max-width:150px}table{width:100%;min-width:720px;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #392951;vertical-align:top}.table{overflow:auto}.muted,small{color:#b8accd}#status{min-height:24px;color:#d8c9f0}.invite{margin-top:12px;overflow-wrap:anywhere;color:#e7d5ff}</style></head><body><main class="wrap"><header class="top"><a class="brand" href="../">Trivexa<span>AI</span> Admin</a><a class="btn" href="./account.html">My account</a></header><h1>Admin Dashboard</h1><p class="muted">Manage users and advanced access. Server-side role checks protect every action.</p><section class="panel"><h2>Create invite</h2><div class="row"><label>Max uses <input id="uses" type="number" min="1" max="100" value="1"></label><label>Expiry days <input id="days" type="number" min="1" max="90" value="7"></label><button class="primary" id="create">Create invite</button></div><p id="invite" class="invite"></p></section><section class="panel"><div class="row"><h2>Recent accounts (up to 200)</h2><button id="refresh">Refresh</button></div><div class="table"><table><thead><tr><th>User</th><th>Email</th><th>Status</th><th>Advanced</th><th>Actions</th></tr></thead><tbody id="users"><tr><td colspan="5">Loading…</td></tr></tbody></table></div><p id="status" role="status"></p></section></main><script type="module">import{auth,authReady,getAccountProfile,workerRequest}from"./auth-client.js";const $=x=>document.getElementById(x);let rows=[];const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));async function req(x){return workerRequest(x);}async function load(){await authReady;if(!auth?.currentUser){location.replace("./login.html?next="+encodeURIComponent(location.href));return;}try{const me=await req({action:"auth_me"});if(me.user.role!=="admin"){document.querySelector(".wrap").innerHTML="<h1>Access denied</h1><p>This Google account is not an administrator.</p><a href='./account.html'>My account</a>";return;}await refresh();}catch(e){$("status").textContent=e.message;}}async function refresh(){ $("status").textContent="Loading…";try{const d=await req({action:"admin_list_users"});rows=d.users||[];render();$("status").textContent="Loaded "+rows.length+" accounts.";}catch(e){$("status").textContent=e.message;}}function render(){const body=$("users");body.replaceChildren();for(const u of rows){const tr=document.createElement("tr");tr.innerHTML='<td>'+esc(u.displayName||"Creator")+'<br><small>'+esc(u.uid)+'</small></td><td>'+esc(u.email)+'</td><td>'+esc(u.status)+'</td><td>'+esc(u.advancedAccess)+'</td><td><button data-uid="'+esc(u.uid)+'" data-a="approved">Approve</button> <button data-uid="'+esc(u.uid)+'" data-a="revoked">Revoke</button> <button data-uid="'+esc(u.uid)+'" data-s="suspended">Suspend</button> <button class="danger" data-uid="'+esc(u.uid)+'" data-s="banned">Ban</button> <button data-uid="'+esc(u.uid)+'" data-s="active">Activate</button></td>';body.appendChild(tr);}if(!rows.length)body.innerHTML='<tr><td colspan="5">No accounts yet.</td></tr>';}$("users").onclick=async e=>{const b=e.target.closest("button[data-uid]");if(!b)return;const uid=b.dataset.uid;try{if(b.dataset.a){if(!confirm("Set advanced access to "+b.dataset.a+"?"))return;await req({action:"admin_set_access",targetUid:uid,advancedAccess:b.dataset.a});}else{if(!confirm("Set account status to "+b.dataset.s+"?"))return;await req({action:"admin_set_status",targetUid:uid,status:b.dataset.s});}await refresh();}catch(err){$("status").textContent=err.message;}};$("create").onclick=async()=>{try{const d=await req({action:"admin_create_invite",maxUses:Number($("uses").value)||1,expiresDays:Number($("days").value)||7});$("invite").textContent="Copy this code now (it is shown only once): "+d.code;}catch(e){$("status").textContent=e.message;}};$("refresh").onclick=refresh;load();</script></body></html>
