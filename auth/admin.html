<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#100b20">
  <title>Admin Dashboard · TrivexaAI</title>
  <link rel="icon" href="../trivexaai-icon.png">
  <script type="module" src="./auth-client.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#100b20;--panel:#1a1230;--panel2:#21183a;--purple:#9b6cff;--pink:#e879f9;--text:#f8f6fc;--muted:#b8accd;--border:#392951}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,rgba(155,108,255,.2),transparent 42rem),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .wrap{max-width:1160px;width:94%;margin:28px auto 60px}
    .top,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .brand{display:inline-flex;align-items:center;gap:10px;color:white;text-decoration:none;font-size:21px;font-weight:900;letter-spacing:-.5px}
    .brand img{width:39px;height:39px;object-fit:cover;border-radius:11px}
    .brand span{color:var(--pink)}
    .btn,button,input{font:inherit}
    .btn,button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:9px 12px;border:1px solid #493466;border-radius:10px;background:#2a2042;color:white;cursor:pointer;text-decoration:none;font-size:12px;font-weight:750}
    button:hover,.btn:hover{border-color:#9b6cff}
    button.primary{background:linear-gradient(100deg,#a78bfa,#e879f9);color:#1b102d;border:0}
    button.danger{background:#50213c;border-color:#75405a}
    button.success{background:#174b3a;border-color:#327b5e;color:#c8ffe1}
    button:disabled{opacity:.55;cursor:wait}
    input{width:120px;min-height:38px;padding:9px;background:var(--bg);color:white;border:1px solid #493466;border-radius:9px}
    h1{margin:25px 0 5px;font-size:clamp(25px,4vw,34px);letter-spacing:-.8px}
    h2{font-size:18px;margin:0}
    .muted,small{color:var(--muted)}
    .lead{margin:0 0 22px;color:var(--muted);font-size:13px;line-height:1.6}
    .panel{margin:16px 0;padding:clamp(16px,3vw,22px);border:1px solid var(--border);border-radius:17px;background:linear-gradient(145deg,rgba(33,24,58,.94),rgba(26,18,48,.98));box-shadow:0 15px 42px rgba(0,0,0,.14)}
    .invite{margin:12px 0 0;overflow-wrap:anywhere;color:#e7d5ff;line-height:1.6}
    .table{width:100%;overflow:auto;margin-top:15px;border:1px solid rgba(196,181,253,.12);border-radius:12px}
    table{width:100%;min-width:850px;border-collapse:collapse;font-size:12px}
    th,td{padding:12px 11px;text-align:left;border-bottom:1px solid rgba(196,181,253,.11);vertical-align:middle}
    th{position:sticky;top:0;background:#211832;color:#e8ddf7;font-size:11px;letter-spacing:.3px}
    tbody tr:last-child td{border-bottom:0}
    tbody tr:hover{background:rgba(155,108,255,.045)}
    .user-name{font-weight:800;color:#f6f0ff}
    .uid{display:block;max-width:170px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:#9588a9}
    .email{max-width:210px;overflow-wrap:anywhere}
    .state{display:inline-flex;padding:5px 8px;border-radius:99px;border:1px solid rgba(196,181,253,.18);background:rgba(155,108,255,.08);font-size:10px;font-weight:800;white-space:nowrap}
    .state.active,.state.approved{color:#baf6d5;border-color:rgba(140,240,189,.25);background:rgba(40,190,125,.1)}
    .state.banned,.state.suspended,.state.revoked{color:#ffc0cf;border-color:rgba(255,120,150,.25);background:rgba(255,90,120,.09)}
    .actions{display:flex;flex-wrap:wrap;gap:6px;min-width:225px}
    .actions button{min-height:32px;padding:7px 9px;font-size:10px}
    .protected{font-size:10px;color:#998eaa;font-style:italic}
    #status{min-height:22px;margin:12px 0 0;color:#d8c9f0;font-size:12px}
    @media(max-width:600px){.wrap{width:calc(100% - 22px);margin:16px auto 40px}.brand{font-size:19px}.brand img{width:34px;height:34px}.row{align-items:flex-start}.panel{border-radius:14px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <a class="brand" href="../"><img src="../trivexaai-icon.png" alt="" width="39" height="39"><span>TrivexaAI</span> Admin</a>
      <a class="btn" href="./account.html">My account</a>
    </header>
    <h1>Admin Dashboard</h1>
    <p class="lead">Manage user accounts, advanced access and invite codes. Changes are checked securely by the Worker.</p>

    <section class="panel">
      <div class="row">
        <h2>Create invite code</h2>
        <div class="row">
          <label class="muted">Max uses <input id="uses" type="number" min="1" max="100" value="1"></label>
          <label class="muted">Expiry days <input id="days" type="number" min="1" max="90" value="7"></label>
          <button class="primary" id="create" type="button">＋ Create invite</button>
        </div>
      </div>
      <p id="invite" class="invite" aria-live="polite"></p>
    </section>

    <section class="panel">
      <div class="row">
        <h2>Recent accounts <span class="muted" style="font-size:12px;font-weight:500">(up to 200)</span></h2>
        <button id="refresh" type="button">↻ Refresh list</button>
      </div>
      <div class="table">
        <table>
          <thead><tr><th>User</th><th>Email</th><th>Role</th><th>Account status</th><th>Advanced access</th><th>Actions</th></tr></thead>
          <tbody id="users"><tr><td colspan="6">Loading accounts…</td></tr></tbody>
        </table>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script type="module">
    import {auth,authReady,workerRequest,getInitializationError} from "./auth-client.js";
    const $=id=>document.getElementById(id);
    let rows=[];
    let adminUid="";
    let loading=false;
    let refreshing=false;
    const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));

    // Retry only safe read requests. Never automatically repeat invite creation or account changes.
    async function req(payload,{safeRead=false}={}){
      const attempts=safeRead?3:1;
      for(let attempt=0;attempt<attempts;attempt++){
        try{return await workerRequest(payload);}
        catch(error){
          const transient=error instanceof TypeError ||
            /failed to fetch|network|load failed|temporar/i.test(String(error?.message||"")) ||
            [502,503,504].includes(error?.status);
          if(!safeRead||!transient||attempt===attempts-1)throw error;
          await wait(500*(attempt+1));
        }
      }
    }

    async function waitForAuth(){
      // Firebase may take longer than 12 seconds to restore a saved Google session.
      // Wait for its real initial auth-state event instead of failing a valid session early.
      await authReady;
      const initError=getInitializationError?.();
      if(initError){
        throw new Error("Firebase account session initialize nahi ho saka: "+(initError.message||"Please reload and try again."));
      }
    }

    function showAccessDenied(){
      document.querySelector(".wrap").innerHTML="<h1>Access denied</h1><p>This Google account is not an administrator.</p><a class='btn' href='./account.html'>My account</a>";
    }

    async function load(){
      if(loading)return;
      loading=true;
      $("status").textContent="Checking secure login and administrator access…";
      $("refresh").disabled=true;
      try{
        await waitForAuth();
        if(!auth?.currentUser){
          location.replace("./login.html?next="+encodeURIComponent(location.href));
          return;
        }
        const me=await req({action:"auth_me"},{safeRead:true});
        if(me.user?.role!=="admin"){showAccessDenied();return;}
        adminUid=me.user.uid;
        $("status").textContent="Admin verified. Loading accounts…";
        await refresh();
      }catch(error){
        $("status").textContent=(error.message||"Dashboard load nahi ho saka.")+" — Retry button dabayein.";
        $("users").innerHTML='<tr><td colspan="6">Accounts abhi load nahi huay. Refresh list dabayein.</td></tr>';
      }finally{
        loading=false;
        if($("refresh"))$("refresh").disabled=false;
      }
    }

    async function refresh(){
      if(refreshing)return;
      refreshing=true;
      $("status").textContent="Loading accounts…";
      $("refresh").disabled=true;
      try{
        const data=await req({action:"admin_list_users"},{safeRead:true});
        rows=Array.isArray(data.users)?data.users:[];
        render();
        $("status").textContent="Loaded "+rows.length+" accounts.";
      }catch(error){
        $("status").textContent=(error.message||"Accounts load nahi huay.")+" — dobara Refresh list dabayein.";
        if(!rows.length)$("users").innerHTML='<tr><td colspan="6">Accounts list filhal available nahi. Dobara try karein.</td></tr>';
      }finally{
        refreshing=false;
        $("refresh").disabled=false;
      }
    }

    function render(){
      const body=$("users");
      body.replaceChildren();
      for(const user of rows){
        const isSelf=user.uid===adminUid;
        const isAdmin=user.role==="admin";
        const protectedAccount=isSelf||isAdmin;
        const status=String(user.status||"active");
        const advanced=String(user.advancedAccess||"pending");
        let actions="";
        if(protectedAccount){
          actions='<span class="protected">'+(isSelf?"Your owner account":"Admin account protected")+'</span>';
        }else{
          const advancedButton=advanced==="approved"
            ?'<button type="button" data-action="access" data-value="revoked" data-uid="'+esc(user.uid)+'">Revoke</button>'
            :'<button type="button" class="success" data-action="access" data-value="approved" data-uid="'+esc(user.uid)+'">Approve</button>';
          let statusButtons="";
          if(status==="banned"||status==="suspended"){
            statusButtons='<button type="button" class="success" data-action="status" data-value="active" data-uid="'+esc(user.uid)+'">Activate</button>';
          }else{
            statusButtons='<button type="button" data-action="status" data-value="suspended" data-uid="'+esc(user.uid)+'">Suspend</button><button type="button" class="danger" data-action="status" data-value="banned" data-uid="'+esc(user.uid)+'">Ban</button>';
          }
          actions=advancedButton+statusButtons;
        }
        const row=document.createElement("tr");
        row.innerHTML=
          '<td><span class="user-name">'+esc(user.displayName||"Creator")+'</span><span class="uid" title="'+esc(user.uid)+'">'+esc(user.uid)+'</span></td>'+
          '<td class="email">'+esc(user.email)+'</td>'+
          '<td>'+esc(user.role||"user")+'</td>'+
          '<td><span class="state '+esc(status)+'">'+esc(status)+'</span></td>'+
          '<td><span class="state '+esc(advanced)+'">'+esc(advanced)+'</span></td>'+
          '<td><div class="actions">'+actions+'</div></td>';
        body.appendChild(row);
      }
      if(!rows.length)body.innerHTML='<tr><td colspan="6">No accounts yet.</td></tr>';
    }

    $("users").addEventListener("click",async event=>{
      const button=event.target.closest("button[data-uid]");
      if(!button)return;
      const uid=button.dataset.uid,action=button.dataset.action,value=button.dataset.value;
      const label=action==="access"?"advanced access":"account status";
      if(!confirm("Change "+label+" to "+value+"?"))return;
      button.disabled=true;
      $("status").textContent="Saving change…";
      try{
        if(action==="access")await req({action:"admin_set_access",targetUid:uid,advancedAccess:value});
        else if(action==="status")await req({action:"admin_set_status",targetUid:uid,status:value});
        await refresh();
      }catch(error){
        $("status").textContent=error.message||"Could not save this change.";
        button.disabled=false;
      }
    });

    $("create").addEventListener("click",async()=>{
      const button=$("create");
      button.disabled=true;
      $("invite").textContent="Creating invite…";
      try{
        // Do not retry this mutation automatically: the code is displayed only once.
        const data=await req({action:"admin_create_invite",maxUses:Number($("uses").value)||1,expiresDays:Number($("days").value)||7});
        $("invite").textContent="Copy this code now (it is shown only once): "+data.code;
      }catch(error){
        $("invite").textContent=(error.message||"Could not create invite.")+" Please try again.";
      }finally{button.disabled=false;}
    });

    $("refresh").addEventListener("click",()=>adminUid?refresh():load());
    load();
  </script>
</body>
</html>
