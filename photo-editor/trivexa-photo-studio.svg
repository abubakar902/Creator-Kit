 <path d="M65 113 111 66l30 30 17-17 30 31v42H65Z" fill="url(#mount)" opacity=".95"/>
 <circle cx="157" cy="52" r="13" fill="#fff3c5" stroke="#fff" stroke-width="3"/>
 <path d="M75 53h103v25h-39v69h-27V78H75Z" fill="url(#ai)" stroke="#11153b" stroke-width="5" stroke-linejoin="round"/>
 <path d="m202 20 7 14 14 7-14 7-7 14-7-14-14-7 14-7Z" fill="#fff" stroke="#9df7ff" stroke-width="2"/>
