<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" role="img" aria-labelledby="title desc">
<title id="title">TrivexaAI Photo Studio</title><desc id="desc">Layered neon photo-frame emblem and TrivexaAI Photo Studio wordmark</desc>
<defs>
 <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff50df"/><stop offset=".42" stop-color="#7653ff"/><stop offset="1" stop-color="#08dff5"/></linearGradient>
 <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172c70"/><stop offset=".55" stop-color="#101943"/><stop offset="1" stop-color="#07152e"/></linearGradient>
 <linearGradient id="ai" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#09d9ff"/><stop offset=".52" stop-color="#8b63ff"/><stop offset="1" stop-color="#f34bdc"/></linearGradient>
 <linearGradient id="mount" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f34bdc"/><stop offset=".5" stop-color="#8b57ff"/><stop offset="1" stop-color="#00dffc"/></linearGradient>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g transform="translate(12 14)" filter="url(#glow)">
